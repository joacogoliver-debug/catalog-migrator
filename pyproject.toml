# Configuración del proyecto, del linter, del verificador de tipos y de los tests.
#
# El motor es el paquete `migrador`, en `src/`. La app de escritorio vive en
# `app/` y lo consume. Lo que se distribuye sigue siendo un ejecutable, no un
# paquete de PyPI, pero declararlo instalable tiene dos ventajas concretas: los
# imports dejan de depender de desde qué carpeta se ejecute, y las dependencias
# quedan escritas en un solo lugar con su nombre.
#
# Los archivos requirements-*.txt siguen existiendo y son la fuente. Los extras
# de acá los espejan, y `tests/test_dependencias.py` verifica que digan lo
# mismo: dos listas de dependencias que se separan es la forma clásica de que un
# build ande en una máquina y no en otra.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migrador-catalogos"
description = "Releva el catálogo de un artista y prepara su migración a otra distribuidora"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Joaquín García Oliver" }]
# La versión vive en app/server.py, que es lo que leen el instalador, el release
# y la interfaz. Se lee de ahí para no tener dos números que discrepen.
dynamic = ["version"]
# El núcleo no necesita nada: relevar, agrupar y validar se hacen con la
# biblioteca estándar. Lo que hace falta para cada cosa está en los extras.
dependencies = []

[project.optional-dependencies]
# La app de escritorio. Es lo que instala quien quiere usarla desde el código.
app = ["openpyxl>=3.1", "pywebview>=5.0"]
# El módulo de audio, opcional y apagado por defecto. Necesita además ffmpeg en
# el PATH, que no es un paquete de pip.
audio = ["tiddl>=3.4.1", "yt-dlp>=2024.1.0", "imageio-ffmpeg>=0.6"]
# Las herramientas de quien desarrolla.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.16.8", "pyright>=1.1.400", "pre-commit>=4.0"]

[project.urls]
Repositorio = "https://github.com/joacogoliver-debug/catalog-migrator"
Novedades = "https://github.com/joacogoliver-debug/catalog-migrator/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "migrador.version.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
# El núcleo: errores de sintaxis y estilo (E, W), lo que pyflakes encuentra de
# verdad roto (F) y los errores comunes de bugbear (B). No se suman las familias
# de opinión (estilo de comillas, orden de argumentos, reescrituras de sintaxis)
# porque generan ruido sin encontrar defectos, y un linter que avisa de cosas
# que nadie va a arreglar termina ignorado.
select = ["E", "F", "W", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Los tests y el launcher arman sys.path antes de importar los módulos del
# proyecto: el import no puede estar arriba de todo porque todavía no habría
# nada que importar.
"tests/*.py" = ["E402"]
"app/launcher.py" = ["E402"]
"app/server.py" = ["E402"]
"relevar_core.py" = ["E402"]

[tool.ruff.format]
# El formateador usa el mismo `line-length` de arriba. Se adopta con una salvedad
# dicha en voz alta: es estilo Black, así que colapsa los comentarios alineados a
# la derecha, y en un código que se apoya tanto en sus comentarios eso se nota. A
# cambio, el formato deja de depender de la costumbre de cada uno.
#
# `skip-magic-trailing-comma = false` es el default y se deja explícito: una coma
# final puesta a mano es una decisión de quien escribió, y el formateador la
# respeta en vez de recomprimir la lista.
skip-magic-trailing-comma = false


# ============================================================
# Tipos
# ============================================================

[tool.pyright]
# Estricto progresivo. El objetivo es `strict`, pero prenderlo de golpe sobre un
# código sin una sola anotación deja cientos de errores que nadie va a leer, y un
# verificador que grita siempre es un verificador apagado.
#
# El camino es: `basic` limpio hoy, y cada regla de `strict` se prende cuando el
# módulo que la rompe ya está tipado. El ítem que tipa los contratos entre
# módulos es el que va a mover esta línea.
typeCheckingMode = "basic"

# Los módulos viven en la raíz, el backend en `app/` y las herramientas de
# empaquetado en `build/`, y no hay paquete instalable. Sin esto, pyright no
# resuelve `import server` ni `import notas_release` y reporta como error algo
# que en tiempo de ejecución funciona.
extraPaths = ["src", "app", "build"]

# La app apunta a la versión con la que se compila el binario, no a la que tenga
# instalada quien desarrolla.
pythonVersion = "3.13"

include = ["app", "build", "src", "tests"]
exclude = ["**/__pycache__", "build/_pyinstaller", "dist", ".venv"]

# Dependencias opcionales del módulo de audio. No están instaladas en el CI a
# propósito, y no tener sus stubs no es un error del código.
reportMissingModuleSource = "none"


# ============================================================
# Tests
# ============================================================

[tool.pytest.ini_options]
# Una sola lista de tests, y es esta carpeta. Antes estaba escrita tres veces,
# en build/build.py, en el workflow del CI y en el README, y agregar un test
# pedía acordarse de los tres lugares.
testpaths = ["tests"]
# `--strict-markers` para que una marca mal escrita falle en vez de ignorarse.
addopts = "--strict-markers"

[tool.coverage.run]
# Se mide la app, no los tests. La cobertura de un test siempre da 100 y sólo
# sirve para inflar el número.
# Por carpeta y no por nombre de módulo: con nombres sueltos, mover un archivo
# lo saca de la medición en silencio y la cobertura "sube" sin que nadie haya
# escrito un test. Pasó exactamente eso al mover el motor a src/.
source = ["app", "src/migrador"]

[tool.coverage.report]
# El umbral no está puesto donde nos gustaría, está puesto donde estamos. Subirlo
# es trabajo; bajarlo, en cambio, tiene que romper el build.
#
# Por qué no es más alto. Tres módulos hacen casi sólo entrada y salida contra
# servicios externos: `relevar_core` (YouTube), `portadas` (iTunes) y `audio`
# (Tidal y YouTube), y probarlos de verdad pide red y credenciales. Lo que sí
# está cubierto de ellos es el parseo y las decisiones, que es donde viven los
# errores. `app/launcher.py` queda en cero porque abre ventanas del sistema y no
# hay forma honesta de probar eso sin escritorio.
# Sube cuando sube la cobertura, nunca baja. Se verificó además sin `tiddl`
# instalado, que es como corre el CI, y da lo mismo.
fail_under = 58
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
