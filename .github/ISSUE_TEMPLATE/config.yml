      Security issues go here, privately, never as a public issue.
      Los problemas de seguridad van por acá, en privado.

  - name: Cómo contribuir / How to contribute
    url: https://github.com/joacogoliver-debug/catalog-migrator/blob/main/CONTRIBUTING.md
    about: >
      Antes de mandar un pull request. Before sending a pull request.
