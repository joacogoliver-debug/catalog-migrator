# Un issue en blanco no sirve a nadie: quien lo abre no sabe qué hace falta y
# quien lo lee termina pidiendo la versión y el sistema operativo en el primer
# mensaje. Las plantillas preguntan eso de entrada.
blank_issues_enabled: false

contact_links:
