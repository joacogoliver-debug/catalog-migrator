name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    # Dos versiones de Python, y las dos importan. 3.13 es con la que se compila
    # el binario que la gente baja, así que es la que tiene que estar bien. 3.14
    # es la que ya está instalada en las máquinas donde se escribe el código, y
    # probar sólo la primera dejaba esa diferencia sin cubrir hasta que algo se
    # rompía en el escritorio de alguien.
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # openpyxl y las herramientas de desarrollo. Los extras de audio
          # (tiddl / yt-dlp / ffmpeg) NO se instalan a propósito: los tests son
          # offline y tienen que pasar sin ellos, lo que además demuestra que la
          # degradación es correcta. El test de contrato con tiddl se saltea
          # solo cuando la librería no está.
          pip install openpyxl
          pip install -r requirements-dev.txt

      - name: Estilo y errores comunes (ruff)
        # La configuración está en pyproject.toml, así que el CI, el gancho de
        # pre-commit y la máquina de quien escribe miran exactamente las mismas
        # reglas. La versión va clavada en requirements-dev.txt para que una
        # release de ruff no rompa el build un martes.
        run: ruff check --output-format=github .

      - name: Formato (ruff format)
        # `--check` no reescribe nada: falla y muestra qué archivo está fuera de
        # formato. Localmente lo arregla el gancho de pre-commit antes de que
        # llegue hasta acá.
        run: ruff format --check .

      - name: Tests y cobertura
        # Un solo paso y una sola lista de tests, la de pyproject.toml. Antes
        # había un step por archivo y la lista vivía además en build/build.py y
        # en el README.
        #
        # El umbral de cobertura también sale de pyproject.toml y hace fallar el
        # build si baja.
        run: pytest -q --cov --cov-report=term

      - name: El paquete importa sin los extras de audio
        # Sin instalar nada: `src` al path y listo, que es como lo corre alguien
        # que clona el repositorio. Si esto falla, es que el núcleo empezó a
        # depender del módulo opcional.
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from migrador import audio, paquete, portadas, productos  # noqa: F401

          entorno = audio.verificar_entorno()
          assert entorno["puede_flac"] is False, "sin tiddl/ffmpeg no debe habilitar FLAC"
          print("degradacion correcta:", entorno)
          PY

      - name: El icono se puede regenerar desde el código
        # No se comparan bytes contra el commiteado: dos versiones de Pillow
        # pueden escribir el mismo PNG con bytes distintos y el test se volvería
        # inestable por algo que no es un problema. Lo que importa es que el
        # script corra y produzca los tamaños que Windows y el instalador piden.
        run: |
          pip install pillow
          python build/icono.py
          python - <<'PY'
          from PIL import Image

          tam = sorted(Image.open("app/web/assets/icono.ico").ico.sizes())
          assert (256, 256) in tam and (16, 16) in tam, tam

          png = Image.open("app/web/assets/icono.png")
          assert png.size == (512, 512), png.size

          # El .icns es el del .app de macOS. Se escribe a mano, porque Pillow
          # sólo lo sabe guardar en macOS, así que conviene verificar que salga
          # legible: sin los @2x el icono se ve borroso en cualquier Retina.
          icns = Image.open("app/web/assets/icono.icns")
          medidas = set(icns.info["sizes"])
          assert (512, 512, 2) in medidas, medidas
          assert (16, 16, 2) in medidas, medidas

          print("iconos ok:", tam, sorted(medidas))
          PY

      - name: No quedan claves en el repositorio
        # El mismo script que corre el gancho de pre-commit, acá sobre el árbol
        # entero. Es a propósito una sola implementación: dos controles parecidos
        # escritos por separado terminan discrepando, y el que falla primero es
        # el que nadie mira.
        run: python build/sin_claves.py --todo

  tipos:
    # pyright va en su propio job, y no como un paso más del de arriba, por una
    # razón concreta: el job `tests` corre a propósito SIN las dependencias
    # opcionales, para demostrar que el núcleo no depende de ellas. Un
    # verificador de tipos en ese entorno reportaría como faltantes los imports
    # de `tiddl`, `webview` y `PIL`, que en la máquina de un usuario existen.
    #
    # Así cada job prueba una cosa distinta: aquél, que la degradación es
    # correcta; éste, que los tipos cierran contra el conjunto real de
    # dependencias.
    name: tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar el paquete con todos sus extras
        # Se instala de verdad, con `-e .[...]`, y no desde los
        # requirements-*.txt: así este job verifica de paso que la metadata de
        # pyproject.toml sea válida y que los tres extras existan. Que pidan lo
        # mismo que los requirements lo verifica tests/test_dependencias.py.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,audio,dev]"
          pip install pillow

      - name: pyright
        # Modo estricto progresivo, configurado en pyproject.toml. Hoy el
        # repositorio pasa en cero errores, así que cualquier número distinto de
        # cero es algo que se introdujo en este cambio.
        run: pyright
