name: build

# Compila la app para Windows, macOS y Linux, y arma el instalador de Windows.
#
# Se corre a mano o al publicar un tag vX.Y.Z. Los binarios se compilan acá, en
# GitHub, desde el código público: cualquiera puede leer el log y verificar que
# el ejecutable que descarga sale de este repo y no de la máquina de alguien.
#
# No se firma el binario (un certificado EV de Windows y la cuenta de Apple
# cuestan plata, y el proyecto es gratis). En su lugar publicamos el SHA256 y una
# atestación de procedencia, que es gratis y verificable con `gh attestation`.
#
# La clave de YouTube de la variante completa NO está en el repositorio: viene
# del secreto MIGRADOR_CLAVE_YT y entra recién al empaquetar. Si el secreto no
# está configurado, la variante completa igual se compila, sólo que sin clave, y
# la app le pide la suya al usuario.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Las acciones van fijadas por el SHA del commit, con el tag en un comentario. Un
# tag como `v4` lo puede mover quien controla esa acción, y lo que corre al
# publicar el release tiene permiso de escritura sobre el repositorio. El SHA no
# se mueve; Dependabot propone la actualización y se revisa como cualquier otro
# cambio (ver .github/dependabot.yml).

# De base, sólo lectura. Antes se daba escritura a nivel del workflow, así que la
# recibían también los ocho jobs de compilación, que instalan paquetes de PyPI:
# uno comprometido tenía un token con permiso para escribir en el repositorio.
# Ahora cada job pide lo que usa, y escribe sólo el que publica.
permissions:
  contents: read

# Dos corridas del mismo tag no se pisan. No se cancela la anterior: podría
# estar a mitad de publicar.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      id-token: write        # la atestación de procedencia
      attestations: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macOS va dos veces a propósito. Un ejecutable de PyInstaller sirve
        # para la arquitectura en la que se compiló y para ninguna otra: el que
        # sale de un runner Apple Silicon NO abre en una Mac Intel, que falla
        # con "bad CPU type in executable" sin decir por qué. Hasta acá se
        # publicaba uno solo y se lo llamaba "macos".
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
        # Dos variantes por plataforma:
        #   completa = módulo de audio, ffmpeg adentro y la clave de YouTube ya
        #              configurada. Se abre y funciona, sin instalar ni crear
        #              nada. Incluye un binario GPLv3 (ver la licencia de FFmpeg).
        #   esencial = relevamiento, planilla, validación, ingesta y portadas.
        #              Más liviana y sin clave incluida: cada quien usa la suya.
        variante: [completa, esencial]
        include:
          - os: windows-latest
            nombre: windows
          - os: macos-latest
            nombre: macos-apple-silicon
          - os: macos-15-intel
            nombre: macos-intel
          - os: ubuntu-latest
            nombre: linux

    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.nombre }} · ${{ matrix.variante }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.13 y no 3.12: tiddl 3.x declara Requires-Python >=3.13, y en 3.12
          # pip resuelve a la 2.8.0, que no tiene la clase TidalAPI que usa el
          # módulo de audio. Se compilaba la variante sin audio y fallaba la
          # completa con "No matching distribution found for tiddl".
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
          # pytest incluido: build.py corre la suite antes de empaquetar y
          # aborta si algo falla.
          pip install -r requirements-dev.txt
          # Con versión fija, en su propio archivo, así Dependabot la actualiza
          # y no se compila con lo que PyPI tenga ese día.
          pip install -r requirements-build.txt

      - name: Instalar dependencias de audio
        if: matrix.variante == 'completa'
        # tiddl + yt-dlp + el ffmpeg que se empaqueta adentro.
        run: pip install -r requirements-audio.txt imageio-ffmpeg

      - name: Instalar Inno Setup
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          } else {
            Write-Output "Inno Setup ya esta en la imagen"
          }

      - name: ¿Está configurada la clave de YouTube?
        id: clave
        shell: bash
        env:
          K: ${{ secrets.MIGRADOR_CLAVE_YT }}
        run: |
          # Un secreto no se puede evaluar en un `if:`, así que lo traducimos a
          # una salida del step. Nunca se imprime el valor.
          if [ -n "$K" ]; then echo "hay=si" >> "$GITHUB_OUTPUT"; else echo "hay=no" >> "$GITHUB_OUTPUT"; fi

      - name: Compilar
        shell: bash
        env:
          MIGRADOR_CLAVE_YT: ${{ secrets.MIGRADOR_CLAVE_YT }}
        run: |
          # build.py corre los tests antes de empaquetar y aborta si alguno falla.
          FLAGS="--instalador"
          if [ "${{ matrix.variante }}" = "completa" ]; then
            FLAGS="$FLAGS --con-audio"
            if [ "${{ steps.clave.outputs.hay }}" = "si" ]; then
              FLAGS="$FLAGS --con-clave"
            else
              echo "::warning::Sin el secreto MIGRADOR_CLAVE_YT: la variante completa sale sin clave incluida."
            fi
          fi
          echo "flags: $FLAGS"
          python build/build.py $FLAGS

      - name: Empaquetar el .app de macOS
        if: runner.os == 'macOS'
        # El .app es una CARPETA, y un artefacto de GitHub la subiría archivo
        # por archivo, perdiendo los permisos de ejecución por el camino. Se
        # comprime en un .zip, que es además como Apple espera que se
        # distribuya una app sin instalador.
        shell: bash
        run: |
          cd dist
          if [ -d "Migrador de Catalogos.app" ]; then
            ditto -c -k --keepParent "Migrador de Catalogos.app"               "Migrador-de-Catalogos-${{ matrix.nombre }}-${{ matrix.variante }}-app.zip"
            rm -rf "Migrador de Catalogos.app"
          else
            echo "::warning::no se genero el .app"
          fi

      - name: Renombrar con la plataforma y la variante
        shell: bash
        run: |
          cd dist
          rm -f *.sha256
          # Sólo el portable: el instalador, el .deb y el .app ya salen con su
          # nombre definitivo.
          if [ -f "Migrador de Catalogos.exe" ]; then
            mv "Migrador de Catalogos.exe" "Migrador-de-Catalogos-${{ matrix.nombre }}-${{ matrix.variante }}.exe"
          elif [ -f "Migrador de Catalogos" ]; then
            mv "Migrador de Catalogos" "Migrador-de-Catalogos-${{ matrix.nombre }}-${{ matrix.variante }}"
          fi
          ls -la

      - name: El ejecutable arranca y sirve la app
        # Compilar no es arrancar. Un import que PyInstaller no ve se nota
        # recién al abrirlo, y el binario se compila sin consola justamente
        # para que ese fallo no se vea. Acá se levanta de verdad y se le pide
        # la página: si no contesta, el build falla y no se publica.
        #
        # No se prueba la ventana nativa a propósito: el runner no tiene
        # escritorio, y lo que importa es que el ejecutable llegue a servir.
        shell: bash
        run: |
          cd dist
          BIN=$(ls | grep '^Migrador-de-Catalogos-'             | grep -vE '\.(sha256|deb|zip)$' | grep -v instalador | head -1)
          echo "probando: $BIN"
          chmod +x "$BIN" || true
          ./"$BIN" --puerto 8931 --no-abrir &
          PID=$!
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8931/; then ok=1; break; fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "::error::el ejecutable no llego a servir la app"
            exit 1
          fi
          echo "arranca y sirve la app"

      - name: Publicar hash
        shell: bash
        run: |
          cd dist
          for f in Migrador-de-Catalogos-* migrador-catalogos_*; do
            [ -e "$f" ] || continue
            case "$f" in *.sha256) continue;; esac
            if command -v sha256sum >/dev/null; then sha256sum "$f" | tee "$f.sha256";
            else shasum -a 256 "$f" | tee "$f.sha256"; fi
          done

      # Sólo corre en repos públicos: GitHub no permite atestaciones en repos
      # privados de cuentas personales ("Feature not available for user-owned
      # private repositories"). Mientras el repo sea privado se saltea y el
      # release igual sale con su SHA256; al pasarlo a público se activa solo.
      # continue-on-error además evita que un cambio de GitHub en esto bloquee
      # una publicación: la atestación es un extra, no el entregable.
      - name: Atestación de procedencia
        if: ${{ github.event.repository.private == false }}
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Migrador-de-Catalogos-*
            dist/migrador-catalogos_*.deb

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migrador-${{ matrix.nombre }}-${{ matrix.variante }}
          path: dist/*
          if-no-files-found: error

  publicar:
    # Sólo al empujar un tag: adjunta los binarios al release. Es el único job
    # que escribe, y lo único que escribe es el release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # El checkout hace falta para leer el CHANGELOG y la prosa de las notas.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artefactos

      - name: Armar las notas desde el CHANGELOG
        # Antes esto eran ciento veinticinco líneas de prosa escritas a mano
        # acá adentro, en dos idiomas, y que no decían qué había cambiado: el
        # CHANGELOG existía y nadie lo leía al publicar.
        #
        # El script además ABORTA si el CHANGELOG no tiene una entrada para la
        # versión que se está tagueando. Sin ese control, taguear con el
        # CHANGELOG todavía en "Sin publicar" produce un release que miente, y
        # eso se descubre cuando ya está publicado.
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python build/notas_release.py             --version "${GITHUB_REF_NAME#v}"             --salida notas-release.md
          echo "----- notas -----"
          cat notas-release.md

      - name: Adjuntar al release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artefactos/**/*
          generate_release_notes: true
          body_path: notas-release.md
