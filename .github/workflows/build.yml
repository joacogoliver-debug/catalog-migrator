name: build

# Compila la app para Windows, macOS y Linux, y arma el instalador de Windows.
#
# Se corre a mano o al publicar un tag vX.Y.Z. Los binarios se compilan acá, en
# GitHub, desde el código público: cualquiera puede leer el log y verificar que
# el ejecutable que descarga sale de este repo y no de la máquina de alguien.
#
# No se firma el binario (un certificado EV de Windows y la cuenta de Apple
# cuestan plata, y el proyecto es gratis). En su lugar publicamos el SHA256 y una
# atestación de procedencia, que es gratis y verificable con `gh attestation`.
#
# La clave de YouTube de la variante completa NO está en el repositorio: viene
# del secreto MIGRADOR_CLAVE_YT y entra recién al empaquetar. Si el secreto no
# está configurado, la variante completa igual se compila, sólo que sin clave, y
# la app le pide la suya al usuario.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write        # necesario para la atestación de procedencia
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS va dos veces a propósito. Un ejecutable de PyInstaller sirve
        # para la arquitectura en la que se compiló y para ninguna otra: el que
        # sale de un runner Apple Silicon NO abre en una Mac Intel, que falla
        # con "bad CPU type in executable" sin decir por qué. Hasta acá se
        # publicaba uno solo y se lo llamaba "macos".
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
        # Dos variantes por plataforma:
        #   completa = módulo de audio, ffmpeg adentro y la clave de YouTube ya
        #              configurada. Se abre y funciona, sin instalar ni crear
        #              nada. Incluye un binario GPLv3 (ver la licencia de FFmpeg).
        #   esencial = relevamiento, planilla, validación, ingesta y portadas.
        #              Más liviana y sin clave incluida: cada quien usa la suya.
        variante: [completa, esencial]
        include:
          - os: windows-latest
            nombre: windows
          - os: macos-latest
            nombre: macos-apple-silicon
          - os: macos-15-intel
            nombre: macos-intel
          - os: ubuntu-latest
            nombre: linux

    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.nombre }} · ${{ matrix.variante }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.13 y no 3.12: tiddl 3.x declara Requires-Python >=3.13, y en 3.12
          # pip resuelve a la 2.8.0, que no tiene la clase TidalAPI que usa el
          # módulo de audio. Se compilaba la variante sin audio y fallaba la
          # completa con "No matching distribution found for tiddl".
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
          # pytest incluido: build.py corre la suite antes de empaquetar y
          # aborta si algo falla.
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Instalar dependencias de audio
        if: matrix.variante == 'completa'
        # tiddl + yt-dlp + el ffmpeg que se empaqueta adentro.
        run: pip install -r requirements-audio.txt imageio-ffmpeg

      - name: Instalar Inno Setup
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          } else {
            Write-Output "Inno Setup ya esta en la imagen"
          }

      - name: ¿Está configurada la clave de YouTube?
        id: clave
        shell: bash
        env:
          K: ${{ secrets.MIGRADOR_CLAVE_YT }}
        run: |
          # Un secreto no se puede evaluar en un `if:`, así que lo traducimos a
          # una salida del step. Nunca se imprime el valor.
          if [ -n "$K" ]; then echo "hay=si" >> "$GITHUB_OUTPUT"; else echo "hay=no" >> "$GITHUB_OUTPUT"; fi

      - name: Compilar
        shell: bash
        env:
          MIGRADOR_CLAVE_YT: ${{ secrets.MIGRADOR_CLAVE_YT }}
        run: |
          # build.py corre los tests antes de empaquetar y aborta si alguno falla.
          FLAGS="--instalador"
          if [ "${{ matrix.variante }}" = "completa" ]; then
            FLAGS="$FLAGS --con-audio"
            if [ "${{ steps.clave.outputs.hay }}" = "si" ]; then
              FLAGS="$FLAGS --con-clave"
            else
              echo "::warning::Sin el secreto MIGRADOR_CLAVE_YT: la variante completa sale sin clave incluida."
            fi
          fi
          echo "flags: $FLAGS"
          python build/build.py $FLAGS

      - name: Renombrar con la plataforma y la variante
        shell: bash
        run: |
          cd dist
          rm -f *.sha256
          # Sólo el portable: el instalador ya sale con su nombre definitivo.
          if [ -f "Migrador de Catalogos.exe" ]; then
            mv "Migrador de Catalogos.exe" "Migrador-de-Catalogos-${{ matrix.nombre }}-${{ matrix.variante }}.exe"
          elif [ -f "Migrador de Catalogos" ]; then
            mv "Migrador de Catalogos" "Migrador-de-Catalogos-${{ matrix.nombre }}-${{ matrix.variante }}"
          fi
          ls -la

      - name: El ejecutable arranca y sirve la app
        # Compilar no es arrancar. Un import que PyInstaller no ve se nota
        # recién al abrirlo, y el binario se compila sin consola justamente
        # para que ese fallo no se vea. Acá se levanta de verdad y se le pide
        # la página: si no contesta, el build falla y no se publica.
        #
        # No se prueba la ventana nativa a propósito: el runner no tiene
        # escritorio, y lo que importa es que el ejecutable llegue a servir.
        shell: bash
        run: |
          cd dist
          BIN=$(ls | grep '^Migrador-de-Catalogos-' | grep -v '\.sha256$' | grep -v instalador | head -1)
          echo "probando: $BIN"
          chmod +x "$BIN" || true
          ./"$BIN" --puerto 8931 --no-abrir &
          PID=$!
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8931/; then ok=1; break; fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "::error::el ejecutable no llego a servir la app"
            exit 1
          fi
          echo "arranca y sirve la app"

      - name: Publicar hash
        shell: bash
        run: |
          cd dist
          for f in Migrador-de-Catalogos-*; do
            case "$f" in *.sha256) continue;; esac
            if command -v sha256sum >/dev/null; then sha256sum "$f" | tee "$f.sha256";
            else shasum -a 256 "$f" | tee "$f.sha256"; fi
          done

      # Sólo corre en repos públicos: GitHub no permite atestaciones en repos
      # privados de cuentas personales ("Feature not available for user-owned
      # private repositories"). Mientras el repo sea privado se saltea y el
      # release igual sale con su SHA256; al pasarlo a público se activa solo.
      # continue-on-error además evita que un cambio de GitHub en esto bloquee
      # una publicación: la atestación es un extra, no el entregable.
      - name: Atestación de procedencia
        if: ${{ github.event.repository.private == false }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Migrador-de-Catalogos-*

      - uses: actions/upload-artifact@v4
        with:
          name: migrador-${{ matrix.nombre }}-${{ matrix.variante }}
          path: dist/*
          if-no-files-found: error

  publicar:
    # Sólo al empujar un tag: adjunta los binarios al release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Adjuntar al release
        uses: softprops/action-gh-release@v2
        with:
          files: artefactos/**/*
          generate_release_notes: true
          body: |
            ## Cuál bajar

            **Windows, la recomendada**:
            `Migrador-de-Catalogos-windows-completa-instalador.exe`. Doble clic,
            Siguiente, y queda en el menú Inicio con su desinstalador. No pide
            permisos de administrador. El instalador pregunta el idioma en la
            primera pantalla, y la app —incluido lo que descarga— queda en el
            que hayas elegido.

            Si preferís no instalar nada, el portable es el `.exe` sin
            `-instalador`. En Linux hay un único archivo, sin instalador.

            **En macOS hay dos, y no son intercambiables**: uno para las Mac con
            chip Apple (`-macos-apple-silicon-`) y otro para las Mac Intel
            (`-macos-intel-`). Para saber cuál te toca:  → "Acerca de esta Mac".
            Si bajás el que no es, la Terminal responde `bad CPU type in
            executable`. Hay una guía paso a paso en
            [docs/INSTALAR-MAC.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALAR-MAC.md).

            | Variante | Qué trae |
            |---|---|
            | **completa** | Todo, más el módulo de audio con ffmpeg adentro y una clave de YouTube ya configurada. Se abre y funciona. |
            | **esencial** | Relevamiento, planilla, validación, hoja de ingesta y portadas. Más liviana, sin ffmpeg y sin clave incluida. |

            Para bajar los audios en FLAC necesitás además tu propia cuenta paga
            de Tidal. El módulo viene desactivado y es opcional.

            La clave de YouTube que trae la variante completa es compartida, está
            restringida a la YouTube Data API v3 y **cualquiera que baje el
            binario la puede extraer**. Si preferís no depender de eso, usá la
            variante `esencial` o cargá la tuya desde la app.

            La versión completa incluye FFmpeg, software de terceros bajo
            licencia GPLv3, que se distribuye sin modificaciones y como programa
            separado.

            ### El sistema va a avisar que el programa "no es reconocido"

            Es esperable: el binario no está firmado porque firmar cuesta plata y
            esto es gratis. El código es público y el ejecutable se compila acá
            en GitHub Actions desde ese código.

            - **Windows**: "Más información" → "Ejecutar de todas formas".
            - **macOS**: clic derecho → "Abrir", o Configuración → Privacidad y
              seguridad → "Abrir de todos modos".

            ### Verificar que el binario es el de este repo

            Compará el SHA256 con el `.sha256` publicado, o usá la atestación:

            ```
            gh attestation verify Migrador-de-Catalogos-windows-completa.exe --repo ${{ github.repository }}
            ```

            ### Términos de uso

            Esta herramienta es para administración de catálogos. No avala ni
            habilita la piratería. El detalle está en `TERMINOS.md`, y la app los
            muestra la primera vez que se abre.

            ---

            # In English

            ## Which one to download

            **Windows, the recommended one**:
            `Migrador-de-Catalogos-windows-completa-instalador.exe`. Double
            click, Next, and it lands in the Start menu with its uninstaller. It
            does not ask for administrator rights. The installer asks for the
            language on its first screen, and the app —including what it
            downloads— stays in whichever one you pick.

            If you would rather not install anything, the portable one is the
            `.exe` without `-instalador`. On Linux there is a single file and
            no installer.

            **On macOS there are two, and they are not interchangeable**: one for
            Macs with an Apple chip (`-macos-apple-silicon-`) and one for Intel
            Macs (`-macos-intel-`). To find out which one you need:  → "About
            This Mac". Downloading the wrong one gets you `bad CPU type in
            executable`. There is a step-by-step guide in
            [docs/INSTALAR-MAC.en.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALAR-MAC.en.md).

            | Variant | What it carries |
            |---|---|
            | **completa** (full) | Everything, plus the audio module with ffmpeg inside and a YouTube key already configured. You open it and it works. |
            | **esencial** (essential) | Survey, spreadsheet, validation, ingestion sheet and artwork. Lighter, no ffmpeg and no bundled key. |

            To download the audio in FLAC you also need your own paid Tidal
            account. The module ships disabled and is optional.

            The YouTube key the full variant carries is shared, restricted to
            YouTube Data API v3, and **anyone who downloads the binary can
            extract it**. If you would rather not depend on that, use the
            `esencial` variant or load your own from the app.

            The full version includes FFmpeg, third-party software under the
            GPLv3 license, distributed unmodified and as a separate program.

            ### Your system is going to say the program is "unrecognized"

            That is expected: the binary is not signed because signing costs
            money and this is free. The code is public and the executable is
            compiled here in GitHub Actions from that code.

            - **Windows**: "More info" → "Run anyway".
            - **macOS**: right click → "Open", or Settings → Privacy & Security
              → "Open Anyway".

            ### Verifying that the binary is the one from this repo

            Compare the SHA256 with the published `.sha256`, or use the
            attestation:

            ```
            gh attestation verify Migrador-de-Catalogos-windows-completa.exe --repo ${{ github.repository }}
            ```

            ### Terms of use

            This tool is for catalog administration. It neither endorses nor
            enables piracy. The detail is in `TERMS.md`, and the app shows the
            terms the first time it opens.
