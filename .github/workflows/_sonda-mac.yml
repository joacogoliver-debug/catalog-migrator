name: _sonda-mac

# Temporal. Corre el binario de macOS con --diagnostico en las dos
# arquitecturas para ver si la ventana nativa abre o si cae al navegador.
# Se borra cuando la pregunta esté contestada.

on:
  push:
    branches: [fix/mac-intel-y-humo]

jobs:
  sonda:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            nombre: apple-silicon
          - os: macos-15-intel
            nombre: intel
    runs-on: ${{ matrix.os }}
    name: sonda (${{ matrix.nombre }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt pyinstaller

      - name: Qué trae pywebview en esta máquina
        run: |
          python - <<'PY'
          import platform, sys
          print("arquitectura:", platform.machine())
          try:
              import webview
              print("webview:", webview.__version__)
              import webview.platforms.cocoa as c
              print("backend cocoa importa: si")
          except Exception as e:
              print("fallo:", type(e).__name__, e)
          PY

      - name: Compilar
        run: python build/build.py

      - name: Diagnostico del binario (no puede colgarse)
        run: |
          cd dist
          BIN="Migrador de Catalogos"
          chmod +x "$BIN"
          ./"$BIN" --diagnostico > diag.txt 2>&1 &
          PID=$!
          sleep 60
          kill $PID 2>/dev/null || true
          echo "===== salida ====="
          cat diag.txt || echo "(sin salida: se colgo antes de imprimir)"
