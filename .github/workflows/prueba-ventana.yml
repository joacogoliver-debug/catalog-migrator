name: prueba de la ventana nativa

# La descarga del paquete depende de la ventana, y en cada sistema la maneja un
# código distinto. Esto la prueba en las Mac de GitHub, que es donde nadie del
# proyecto puede probarla a mano. Ver build/prueba_ventana.py.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ventana:
    name: ventana (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt

      - name: Bajar el paquete desde la ventana nativa
        run: python build/prueba_ventana.py
